
name: DevSecOps Security Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install security linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 flake8-bandit

      - name: Run Flake8 security scan
        run: |
          flake8 src/ --select=E9,F,S --show-source --statistics
