
name: DevSecOps Security Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 flake8-bandit

      - name: Run Flake8 security scan
        run: |
          flake8 src/ --select=E9,F,S --show-source --statistics
